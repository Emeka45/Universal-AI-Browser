plugins { id 'com.android.application' }

android {
    namespace 'com.emeka45.universal.aibrowser'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.emeka45.universal.aibrowser'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
    }

    // Redmi A1 target: package only its 32-bit ARM ABI.
    // This avoids shipping native libraries for unrelated device architectures.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a'
            universalApk false
        }
    }

    // Personal Redmi A1 build: compress GeckoView's native libraries inside the APK.
    // libxul.so is the dominant file, so this materially reduces the APK download size.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            // Shrink app code/resources while preserving GeckoView's required native engine.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep the debug build easy to diagnose during device testing.
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:155.0.20260826195058'
}

tasks.register('prepareIdlenExtension') {
    def outDir = file('src/main/assets/idlen')
    outputs.dir(outDir)
    doLast {
        outDir.deleteDir()
        outDir.mkdirs()
        def xpi = new File(buildDir, 'idlen.xpi')
        new URL('https://addons.mozilla.org/firefox/downloads/latest/idlen-earn-while-you-prompt/latest.xpi').withInputStream { input ->
            xpi.parentFile.mkdirs()
            xpi.withOutputStream { it << input }
        }
        copy { from zipTree(xpi); into outDir }
    }
}

tasks.named('preBuild') { dependsOn 'prepareIdlenExtension' }
