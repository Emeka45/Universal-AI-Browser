plugins { id 'com.android.application' }

android {
    namespace 'com.emeka45.universal.aibrowser'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.emeka45.universal.aibrowser'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
    }

    // Redmi A1 target: package only its 32-bit ARM ABI.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a'
            universalApk false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            // EXPERIMENTAL size test only: these GeckoView libraries support
            // native crash reporting/diagnostics. Excluding them may reduce
            // crash diagnostics, so this is being evaluated on a test branch
            // and will not be merged into main without further validation.
            excludes += [
                '**/libcrashhelper.so',
                '**/libcrashtools.so'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:155.0.20260826195058'
}

tasks.register('prepareIdlenExtension') {
    def outDir = file('src/main/assets/idlen')
    outputs.dir(outDir)
    doLast {
        outDir.deleteDir()
        outDir.mkdirs()
        def xpi = new File(buildDir, 'idlen.xpi')
        new URL('https://addons.mozilla.org/firefox/downloads/latest/idlen-earn-while-you-prompt/latest.xpi').withInputStream { input ->
            xpi.parentFile.mkdirs()
            xpi.withOutputStream { it << input }
        }
        copy { from zipTree(xpi); into outDir }
    }
}

tasks.named('preBuild') { dependsOn 'prepareIdlenExtension' }
