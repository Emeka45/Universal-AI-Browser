plugins { id 'com.android.application' }

android { namespace 'com.emeka45.universal.aibrowser'; compileSdk 36
    defaultConfig { applicationId 'com.emeka45.universal.aibrowser'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'org.mozilla.geckoview:geckoview:159.0.20261001041619' }

tasks.register('prepareIdlenExtension') {
    def outDir = file('src/main/assets/idlen')
    outputs.dir(outDir)
    doLast {
        outDir.deleteDir()
        outDir.mkdirs()
        def xpi = new File(buildDir, 'idlen.xpi')
        new URL('https://addons.mozilla.org/firefox/downloads/latest/idlen-earn-while-you-prompt/latest.xpi').withInputStream { input ->
            xpi.parentFile.mkdirs()
            xpi.withOutputStream { it << input }
        }
        copy { from zipTree(xpi); into outDir }

        def manifestFile = new File(outDir, 'manifest.json')
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        if (!manifest.browser_specific_settings) manifest.browser_specific_settings = [:]
        if (!manifest.browser_specific_settings.gecko) manifest.browser_specific_settings.gecko = [:]
        manifest.browser_specific_settings.gecko.id = 'idlen@universal-ai-browser.local'
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
    }
}

tasks.named('preBuild') { dependsOn 'prepareIdlenExtension' }
