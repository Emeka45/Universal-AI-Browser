name: Android Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify build toolchain
        run: |
          java -version
          gradle --version

      - name: Build optimized Redmi A1 release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Verify APK output and report size
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "Release APK: $APK"
          du -h "$APK"
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -n 3
          fi

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-ai-bridge-redmi-a1-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
